name: gestor_archivos
description: Gestor local de archivos con SQLite para Android.
publish_to: 'none'
version: 2.2.1+6
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  # Acceso a SQLite desde Dart; base local sin servidor.
  sqflite: 2.4.2
  # Construcción, normalización y comparación de rutas.
  path: 1.9.1
  # Directorios privados y temporales del modo privado.
  path_provider: 2.1.5
  # Selector de archivos para importar al modo privado.
  file_picker: 10.3.10
  # Abrir archivos mediante aplicaciones compatibles instaladas.
  open_filex: 4.7.0
  # Menú nativo para compartir archivos.
  share_plus: 10.1.4
  # Objeto XFile utilizado al compartir.
  cross_file: 0.3.4+2
  # Identificación MIME por nombre en el modo privado.
  mime: 2.0.0
  # Compresión y extracción ZIP del modo privado.
  archive: 4.0.9
dev_dependencies:
  # Herramientas de pruebas de Flutter.
  flutter_test:
    sdk: flutter
  # SQLite en pruebas de escritorio; no sustituye a sqflite en Android.
  sqflite_common_ffi: 2.3.6
flutter:
  uses-material-design: true
