name: gestor_archivos
description: Gestor local de archivos con SQLite para Android.
publish_to: 'none'
version: 2.0.0+3
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: 2.4.2
  path: 1.9.1
  path_provider: 2.1.5
  file_picker: 10.3.10
  open_filex: 4.7.0
  share_plus: 10.1.4
  cross_file: 0.3.4+2
  mime: 2.0.0
  archive: 4.0.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: 2.3.6
flutter:
  uses-material-design: true
